name: Build Multi-Platform & Create Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_version:
        description: "Build version"
        required: true
        default: "2.2.0"
      build_number:
        description: "Build number"
        required: true
        default: "19"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"
  UV_PYTHON: "3.14"
  BUILD_VERSION: ${{ inputs.build_version || '2.2.0' }}
  BUILD_NUMBER: ${{ inputs.build_number || '19' }}

jobs:
  # ─── Q. Quality gate: lint + tests (blocks every build) ───────────────
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies (incl. dev group)
        run: uv sync
      - name: Ruff
        run: uv run ruff check src tests
      - name: Ruff format
        run: uv run ruff format --check src tests
      - name: Tests
        run: uv run pytest -q

  # ─── A. Android manifest audit: TV device-catalog evidence ────────────
  # Builds the real app once and dumps the facts Play's device catalog
  # cares about (leanback required flag, LEANBACK_LAUNCHER, PiP flag,
  # min/target SDK, native ABIs, permissions) into the run log. No
  # artifacts uploaded.
  manifest-audit:
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK (first pass may fail on IMA desugaring)
        run: |
          set +e
          uv run flet build apk --yes --project ktv --product "KTV Player" --org ng.kiri -v
          set -e
          test -f build/flutter/android/app/build.gradle.kts
          GRADLE=build/flutter/android/app/build.gradle.kts
          grep -q "isCoreLibraryDesugaringEnabled" "$GRADLE" || \
            sed -i 's/compileOptions {/compileOptions {\n        isCoreLibraryDesugaringEnabled = true/' "$GRADLE"
          grep -q "coreLibraryDesugaring" "$GRADLE" || \
            sed -i 's/dependencies {}/dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}/' "$GRADLE"
          # A template change turns these seds into silent no-ops, which then
          # fails deep inside gradle with an unreadable AAR error.
          grep -q "isCoreLibraryDesugaringEnabled" "$GRADLE" || { echo "ERROR: desugaring flag patch did not apply"; exit 1; }
          grep -q "coreLibraryDesugaring" "$GRADLE" || { echo "ERROR: desugar_jdk_libs dependency missing"; exit 1; }
          # Patch before gradle, exactly like the release jobs (minus the
          # release-only banner/PiP) so the audit judges the shipped manifest.
          MANIFEST=build/flutter/android/app/src/main/AndroidManifest.xml
          bash tools/patch_android_manifest.sh "$MANIFEST"
          test -d build/site-packages || { echo "ERROR: build/site-packages missing"; exit 1; }
          (cd build/flutter/android && SERIOUS_PYTHON_SITE_PACKAGES="$PWD/../../site-packages" ./gradlew assembleDebug --no-daemon)
      - name: Dump manifest + badging facts
        run: |
          APK=$(find build/flutter -name "app-debug.apk" -not -path "*/intermediates/*" | head -1)
          echo "=== APK: $APK ==="
          AAPT=$(find "${ANDROID_HOME:-$HOME/Android}" -name aapt -type f 2>/dev/null | sort -V | tail -1)
          if [ -n "$AAPT" ]; then
            echo "=== badging (sdk/features/native) ==="
            "$AAPT" dump badging "$APK" | grep -E "^package:|sdkVersion|targetSdkVersion|uses-feature|native-code|launchable-activity" || true
            echo "=== manifest: TV / PiP / network ==="
            "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -iE "leanback|picture_in_picture|INTERNET|ACCESS_NETWORK_STATE" | sort -u || true
          else
            echo "(no aapt binary on this runner — the merged manifest below is authoritative)"
          fi
          echo "=== merged manifest source (build output) ==="
          MERGED=$(find build/flutter/android -path "*intermediates*" -name "AndroidManifest.xml" | grep -iE "merged|processDebug" | head -1)
          echo "${MERGED:-<none found>}"
          [ -n "$MERGED" ] && grep -iE "leanback|LEANBACK_LAUNCHER|picture_in_picture|INTERNET|ACCESS_NETWORK_STATE" "$MERGED" | sort -u || true

      # This job exists because 2.0.5 vanished from the Android TV catalog:
      # Play hides apps whose <uses-feature> flags no TV device satisfies.
      # Printing the dump is evidence; asserting on it is the gate. The
      # checks live in tools/check_manifest.py (unit-tested) and read the
      # merged manifest — aapt/aapt2 binaries are not present in every
      # runner image, and grepping badging text is how a check silently
      # becomes a no-op.
      - name: Assert TV device-catalog facts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # AGP has written the processed manifest under several directory
          # names across versions (merged_manifest, packaged_manifests,
          # processDebugMainManifest, ...), so match them all.
          #
          # The search MUST stay under app/build: app/src holds the *source*
          # manifests (debug/profile stubs with no uses-sdk and no features),
          # and checking one of those reports a TV regression that does not
          # exist — it did exactly that for several runs.
          MERGED=$(find build/flutter/android/app/build -path "*/intermediates/*" -name "AndroidManifest.xml" 2>/dev/null             | grep -iE "merged|packaged_manifests|processDebug" | head -1)
          if [ -z "$MERGED" ]; then
            echo "WARNING: no processed AndroidManifest.xml found — the TV catalog could not be verified this run"
            exit 0
          fi
          echo "checking $MERGED"
          set +e
          python3 tools/check_manifest.py "$MERGED" | tee manifest-report.txt
          VERDICT=${PIPESTATUS[0]}
          set -e
          # Publish the verdict with the release. The check is advisory for
          # now: a wrong assertion here would block every APK, and the job
          # log is admin-only, so the evidence has to live where it can
          # actually be read.
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            gh release view "${{ github.ref_name }}" --json body --jq .body > notes.md 2>/dev/null || true
            {
              echo
              echo "### TV manifest audit"
              echo '```'
              cat manifest-report.txt
              echo '```'
            } >> notes.md
            gh release edit "${{ github.ref_name }}" --notes-file notes.md || true
          fi
          echo "manifest audit verdict: $VERDICT (0 = every TV fact verified)"
          # The Android jobs do not depend on this one, so a real TV
          # regression is loud here without withholding a good build.
          exit "$VERDICT"

  # ─── 0. Create Release Tag & Placeholder ───────────────
  prepare-release:
    needs: [quality]
    runs-on: ubuntu-latest
    outputs:
      TAG_NAME: ${{ steps.tag_info.outputs.TAG_NAME }}
      RELEASE_NAME: ${{ steps.tag_info.outputs.RELEASE_NAME }}
      IS_PRERELEASE: ${{ steps.tag_info.outputs.IS_PRERELEASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate Release Tag & Name
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=KTV Player ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "TAG_NAME=build-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=Automated Build (${SHORT_SHA})" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          fi
      - name: Create GitHub Release Placeholder
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.TAG_NAME }}
          name: ${{ steps.tag_info.outputs.RELEASE_NAME }}
          prerelease: ${{ steps.tag_info.outputs.IS_PRERELEASE }}
          make_latest: true
          body: |
            Automated multi-platform build generated from commit `${{ github.sha }}`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 1. Windows (.exe Installer) ─────────────────────────
  build-windows:
    needs: [prepare-release]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Build Windows Portable
        run: uv run flet build windows --yes --project ktv --product "KTV Player" --org ng.kiri --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} -v

      - name: Generate Icon for Installer
        run: |
          uv add pillow
          uv run python -c "from PIL import Image; Image.open('src/assets/icon.png').save('src/assets/icon.ico', format='ICO', sizes=[(256, 256)])"

      - name: Build Windows Installer (Inno Setup)
        run: |
          $IssContent = @"
          [Setup]
          AppId={{7B132174-8745-4B95-8F9B-983C66986F12}}
          AppName=KTV Player
          AppVersion=${{ env.BUILD_VERSION }}
          AppPublisher=Kiri
          AppPublisherURL=https://kiri.ng
          AppSupportURL=https://kiri.ng/support
          AppUpdatesURL=https://kiri.ng/updates
          AppCopyright=Copyright (C) 2026 Kiri
          DefaultDirName={autopf}\KTV Player
          DefaultGroupName=KTV Player
          OutputDir=.\build\installer
          OutputBaseFilename=KTV_Player_Setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          PrivilegesRequired=lowest
          SetupIconFile=.\src\assets\icon.ico
          UninstallDisplayIcon={app}\ktv.exe
          CloseApplications=yes
          AppMutex=KTVPlayer_Mutex

          [Files]
          Source: "build\windows\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\KTV Player"; Filename: "{app}\ktv.exe"
          Name: "{autodesktop}\KTV Player"; Filename: "{app}\ktv.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"; Flags: unchecked
          "@
          Set-Content -Path "installer.iss" -Value $IssContent -Encoding UTF8
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload directly to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          files: build/installer/KTV_Player_Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 2. Android APK (split per ABI) ───────────────────────
  build-apk-split:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > kiri_keystore.jks
      - name: Build APK (split per ABI)
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/kiri_keystore.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # First flet pass may fail on IMA's desugaring
          # requirement; the patch+rebuild step below is the real build.
          set +e
          uv run flet build apk --yes --project ktv --product "KTV Player" --org ng.kiri --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} --split-per-abi --deep-linking-scheme "ktv" --deep-linking-host "play" -v
          code=$?
          set -e
          test -f build/flutter/android/app/build.gradle.kts || exit $code
          echo "flet build exit $code — continuing; desugaring patch + gradle rebuild follow"
      - name: Inject TV banner, icon & rebuild with banner
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/kiri_keystore.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SERIOUS_PYTHON_SITE_PACKAGES: ${{ github.workspace }}/build/site-packages
        run: |
          MANIFEST=build/flutter/android/app/src/main/AndroidManifest.xml
          RES=build/flutter/android/app/src/main/res
          mkdir -p "$RES/drawable-xhdpi" "$RES/mipmap-xxxhdpi"
          cp src/assets/tv_banner.png "$RES/drawable-xhdpi/banner.png"
          cp src/assets/icon.png "$RES/mipmap-xxxhdpi/ic_launcher.png"
          # TV + PiP manifest patches live in one script so the audit
          # job validates exactly what the release jobs ship.
          bash tools/patch_android_manifest.sh "$MANIFEST" --release
          grep -n "supportsPictureInPicture" "$MANIFEST"
          # Remove the unpatched APKs from the first `flet build` step so stale
          # ones can never be staged if the rebuild doesn't regenerate them.
          rm -f build/flutter/build/app/outputs/flutter-apk/*.apk
          rm -f build/flutter/build/app/outputs/apk/release/*.apk
          # -Psplit-per-abi=true: the Flutter Gradle plugin only emits per-ABI
          # APKs when this property is set — plain `assembleRelease` builds the
          # universal APK only. Without it, the per-ABI APKs staged below are
          # the unpatched leftovers from the first `flet build` step.
          # flet-ima (Google IMA video ads) requires core-library
          # desugaring, which Flet's template doesn't enable. Guarded seds
          # are idempotent; the replacement re-adds the closing '}'.
          GRADLE=build/flutter/android/app/build.gradle.kts
          grep -q "isCoreLibraryDesugaringEnabled" "$GRADLE" || \
            sed -i 's/compileOptions {/compileOptions {\n        isCoreLibraryDesugaringEnabled = true/' "$GRADLE"
          grep -q "coreLibraryDesugaring" "$GRADLE" || \
            sed -i 's/dependencies {}/dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}/' "$GRADLE"
          # A template change turns these seds into silent no-ops, which then
          # fails deep inside gradle with an unreadable AAR error.
          grep -q "isCoreLibraryDesugaringEnabled" "$GRADLE" || { echo "ERROR: desugaring flag patch did not apply"; exit 1; }
          grep -q "coreLibraryDesugaring" "$GRADLE" || { echo "ERROR: desugar_jdk_libs dependency missing"; exit 1; }
          grep -n "resolvedMinSdk =" "$GRADLE" || true
          test -d "$SERIOUS_PYTHON_SITE_PACKAGES" || { echo "ERROR: $SERIOUS_PYTHON_SITE_PACKAGES missing"; exit 1; }
          (cd build/flutter/android && ./gradlew assembleRelease -Psplit-per-abi=true)
          rm -rf build/apk
          mkdir -p build/apk
          find build/flutter -name "*.apk" -not -path "*/intermediates/*" -exec cp {} build/apk/ \;
          # README links ktv-<abi>.apk — stage under the historical names so
          # the release always carries exactly one authoritative set.
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mv -f "build/apk/app-${abi}-release.apk" "build/apk/ktv-${abi}.apk" 2>/dev/null || true
          done
          # Verify the TV banner / PiP / optional-mic patches reached the
          # processed manifest (same checker the audit job uses, no aapt).
          # Under app/build only — app/src holds source stubs, not the
          # manifest the build actually shipped. Verification is advisory:
          # the APKs are already built at this point, and withholding them
          # over a missing verification file would be the wrong trade.
          MERGED=$(find build/flutter/android/app/build -path "*/intermediates/*" -name "AndroidManifest.xml" 2>/dev/null             | grep -iE "merged|packaged_manifests|processRelease" | head -1)
          if [ -z "$MERGED" ]; then
            echo "WARNING: no processed release manifest found — skipping the TV manifest verification"
          else
            python3 tools/check_manifest.py "$MERGED" \
              --require-banner --require-pip --allow-optional-mic || \
              echo "WARNING: release manifest facts unverified — see the TV manifest audit in the release notes"
          fi
          ls -lh build/apk/
          echo "Rebuilt split APKs with TV banner (320x180), icon (512x512) and PiP enabled"
      - name: Upload directly to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          files: build/apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 3. Android AAB (Play Store) ──────────────────────────
  build-aab:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > kiri_keystore.jks
      - name: Build AAB
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/kiri_keystore.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # First flet pass may fail on IMA's desugaring
          # requirement; the patch+rebuild step below is the real build.
          set +e
          uv run flet build aab --yes --project ktv --product "KTV Player" --org ng.kiri --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} --deep-linking-scheme "ktv" --deep-linking-host "play" -v
          code=$?
          set -e
          test -f build/flutter/android/app/build.gradle.kts || exit $code
          echo "flet build exit $code — continuing; desugaring patch + gradle rebuild follow"
      - name: Inject TV banner, icon & rebuild with banner
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/kiri_keystore.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SERIOUS_PYTHON_SITE_PACKAGES: ${{ github.workspace }}/build/site-packages
        run: |
          MANIFEST=build/flutter/android/app/src/main/AndroidManifest.xml
          RES=build/flutter/android/app/src/main/res
          mkdir -p "$RES/drawable-xhdpi" "$RES/mipmap-xxxhdpi"
          cp src/assets/tv_banner.png "$RES/drawable-xhdpi/banner.png"
          cp src/assets/icon.png "$RES/mipmap-xxxhdpi/ic_launcher.png"
          # TV + PiP manifest patches live in one script so the audit
          # job validates exactly what the release jobs ship.
          bash tools/patch_android_manifest.sh "$MANIFEST" --release
          grep -n "supportsPictureInPicture" "$MANIFEST"
          # flet-ima (Google IMA video ads) requires core-library
          # desugaring, which Flet's template doesn't enable. Guarded seds
          # are idempotent; the replacement re-adds the closing '}'.
          GRADLE=build/flutter/android/app/build.gradle.kts
          grep -q "isCoreLibraryDesugaringEnabled" "$GRADLE" || \
            sed -i 's/compileOptions {/compileOptions {\n        isCoreLibraryDesugaringEnabled = true/' "$GRADLE"
          grep -q "coreLibraryDesugaring" "$GRADLE" || \
            sed -i 's/dependencies {}/dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}/' "$GRADLE"
          # A template change turns these seds into silent no-ops, which then
          # fails deep inside gradle with an unreadable AAR error.
          grep -q "isCoreLibraryDesugaringEnabled" "$GRADLE" || { echo "ERROR: desugaring flag patch did not apply"; exit 1; }
          grep -q "coreLibraryDesugaring" "$GRADLE" || { echo "ERROR: desugar_jdk_libs dependency missing"; exit 1; }
          grep -n "resolvedMinSdk =" "$GRADLE" || true
          (cd build/flutter/android && ./gradlew bundleRelease)
          rm -rf build/aab
          mkdir -p build/aab
          find build/flutter -name "*.aab" -not -path "*/intermediates/*" -exec cp {} build/aab/ \;
          # README links ktv.aab — stage under the historical name so the
          # release always carries exactly one authoritative set.
          mv -f build/aab/app-release.aab build/aab/ktv.aab 2>/dev/null || true
          # Same manifest gate as the split-APK job (the aapt/unzip variant
          # broke whenever the runner image lacked aapt).
          # Under app/build only — app/src holds source stubs, not the
          # manifest the build actually shipped.
          MERGED=$(find build/flutter/android/app/build -path "*/intermediates/*" -name "AndroidManifest.xml" 2>/dev/null             | grep -iE "merged|packaged_manifests|processRelease" | head -1)
          # Advisory for the same reason as the split-APK job.
          if [ -z "$MERGED" ]; then
            echo "WARNING: no processed release manifest found — skipping the TV manifest verification"
          else
            python3 tools/check_manifest.py "$MERGED" \
              --require-banner --require-pip --allow-optional-mic || \
              echo "WARNING: release manifest facts unverified — see the TV manifest audit in the release notes"
          fi
          ls -lh build/aab/
          echo "Rebuilt AAB with TV banner (320x180), icon (512x512) and PiP enabled"
      - name: Upload directly to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          files: build/aab/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 4. Linux (.deb, .rpm & Universal .tar.gz) ────────────────
  build-linux:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Linux Build Dependencies & Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libmpv-dev mpv pkg-config rpm ruby ruby-dev
          sudo gem install --no-document fpm
      - name: Build Linux Bundle
        run: uv run flet build linux --yes --project ktv --product "KTV Player" --org ng.kiri --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} -v
      - name: Create Linux Packages (.deb, .rpm, .tar.gz)
        run: |
          mkdir -p build/dist

          # 1. Universal Portable .tar.gz
          tar -czf build/dist/KTV_Player_linux_x86_64.tar.gz -C build/linux .

          # 2. Stage filesystem tree for rich .deb and .rpm packages
          mkdir -p pkg_root/usr/lib/ktvplayer pkg_root/usr/bin pkg_root/usr/share/applications pkg_root/usr/share/icons/hicolor/256x256/apps pkg_root/usr/share/pixmaps pkg_root/usr/share/metainfo
          cp -a build/linux/* pkg_root/usr/lib/ktvplayer/
          chmod +x pkg_root/usr/lib/ktvplayer/ktv
          ln -s /usr/lib/ktvplayer/ktv pkg_root/usr/bin/ktvplayer

          # Icons
          cp src/assets/icon.png pkg_root/usr/share/icons/hicolor/256x256/apps/ktvplayer.png
          cp src/assets/icon.png pkg_root/usr/share/pixmaps/ktvplayer.png

          # Desktop entry
          cat <<EOF > pkg_root/usr/share/applications/ktvplayer.desktop
          [Desktop Entry]
          Version=1.0
          Name=KTV Player
          GenericName=IPTV & Local Media Player
          Comment=High-performance IPTV rendering engine and local video player
          Exec=/usr/bin/ktvplayer
          Icon=ktvplayer
          Terminal=false
          Type=Application
          Categories=AudioVideo;Player;TV;
          Keywords=IPTV;Player;Video;Stream;M3U;TV;
          StartupNotify=true
          StartupWMClass=ktv
          EOF

          # AppStream / AppData metainfo XML
          cat <<EOF > pkg_root/usr/share/metainfo/ng.kiri.ktvplayer.metainfo.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>ng.kiri.ktvplayer</id>
            <metadata_license>MIT</metadata_license>
            <project_license>MIT</project_license>
            <name>KTV Player</name>
            <summary>High-performance IPTV rendering engine and local video player</summary>
            <description>
              <p>KTV Player delivers a rich multi-platform media experience:</p>
              <ul>
                <li>Live IPTV streaming with real-time liveliness validation</li>
                <li>Local video library discovery with SAF and intent resolution</li>
                <li>Custom M3U/M3U8 playlist management and stealth shortcodes</li>
                <li>Budget Smart TV and desktop performance optimization</li>
              </ul>
            </description>
            <launchable type="desktop-id">ktvplayer.desktop</launchable>
            <url type="homepage">https://kiri.ng</url>
            <developer_name>Kiri</developer_name>
          </component>
          EOF

          # Build rich .deb using fpm
          fpm -s dir -t deb -n ktvplayer -v ${{ env.BUILD_VERSION }} --iteration ${{ env.BUILD_NUMBER }} \
              --architecture amd64 \
              --description "High-performance IPTV rendering engine and local video player." \
              --maintainer "Kiri <support@kiri.ng>" \
              --url "https://kiri.ng" \
              --category "video" \
              -p build/dist/KTV_Player_amd64.deb \
              -C pkg_root .

          # Build rich .rpm using fpm
          fpm -s dir -t rpm -n ktvplayer -v ${{ env.BUILD_VERSION }} --iteration ${{ env.BUILD_NUMBER }} \
              --architecture x86_64 \
              --description "High-performance IPTV rendering engine and local video player." \
              --maintainer "Kiri <support@kiri.ng>" \
              --url "https://kiri.ng" \
              --category "Video" \
              -p build/dist/KTV_Player_x86_64.rpm \
              -C pkg_root .

      - name: Upload directly to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          files: build/dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}