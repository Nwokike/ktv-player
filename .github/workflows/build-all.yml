name: Build Multi-Platform & Create Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_version:
        description: "Build version"
        required: true
        default: "2.1.0"
      build_number:
        description: "Build number"
        required: true
        default: "18"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"
  UV_PYTHON: "3.14"
  BUILD_VERSION: ${{ inputs.build_version || '2.1.0' }}
  BUILD_NUMBER: ${{ inputs.build_number || '18' }}

jobs:
  # ─── 0. Create Release Tag & Placeholder ───────────────
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      TAG_NAME: ${{ steps.tag_info.outputs.TAG_NAME }}
      RELEASE_NAME: ${{ steps.tag_info.outputs.RELEASE_NAME }}
      IS_PRERELEASE: ${{ steps.tag_info.outputs.IS_PRERELEASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate Release Tag & Name
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=KTV Player ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "TAG_NAME=build-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=Automated Build (${SHORT_SHA})" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          fi
      - name: Create GitHub Release Placeholder
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.TAG_NAME }}
          name: ${{ steps.tag_info.outputs.RELEASE_NAME }}
          prerelease: ${{ steps.tag_info.outputs.IS_PRERELEASE }}
          make_latest: true
          body: |
            Automated multi-platform build generated from commit `${{ github.sha }}`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 1. Windows (.exe Installer) ─────────────────────────
  build-windows:
    needs: [prepare-release]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Build Windows Portable
        run: uv run flet build windows --yes --project ktv --product "KTV Player" --org ng.kiri --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} -v

      - name: Generate Icon for Installer
        run: |
          uv add pillow
          uv run python -c "from PIL import Image; Image.open('src/assets/icon.png').save('src/assets/icon.ico', format='ICO', sizes=[(256, 256)])"

      - name: Build Windows Installer (Inno Setup)
        run: |
          $IssContent = @"
          [Setup]
          AppId={{7B132174-8745-4B95-8F9B-983C66986F12}}
          AppName=KTV Player
          AppVersion=${{ env.BUILD_VERSION }}
          AppPublisher=Kiri
          AppPublisherURL=https://kiri.ng
          AppSupportURL=https://kiri.ng/support
          AppUpdatesURL=https://kiri.ng/updates
          AppCopyright=Copyright (C) 2026 Kiri
          DefaultDirName={autopf}\KTV Player
          DefaultGroupName=KTV Player
          OutputDir=.\build\installer
          OutputBaseFilename=KTV_Player_Setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          PrivilegesRequired=lowest
          SetupIconFile=.\src\assets\icon.ico
          UninstallDisplayIcon={app}\ktv.exe
          CloseApplications=yes
          AppMutex=KTVPlayer_Mutex

          [Files]
          Source: "build\windows\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\KTV Player"; Filename: "{app}\ktv.exe"
          Name: "{autodesktop}\KTV Player"; Filename: "{app}\ktv.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"; Flags: unchecked
          "@
          Set-Content -Path "installer.iss" -Value $IssContent -Encoding UTF8
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload directly to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          files: build/installer/KTV_Player_Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 2. Android APK (universal) ───────────────────────────
  build-apk:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > kiri_keystore.jks
      - name: Build APK (universal)
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/kiri_keystore.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: uv run flet build apk --yes --project ktv --product "KTV Player" --org ng.kiri --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} --deep-linking-scheme "ktv" --deep-linking-host "play" -v
      - name: Inject TV banner, icon & rebuild with banner
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/kiri_keystore.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SERIOUS_PYTHON_SITE_PACKAGES: ${{ github.workspace }}/build/site-packages
        run: |
          MANIFEST=build/flutter/android/app/src/main/AndroidManifest.xml
          RES=build/flutter/android/app/src/main/res
          mkdir -p "$RES/drawable-xhdpi" "$RES/mipmap-xxxhdpi"
          cp src/assets/tv_banner.png "$RES/drawable-xhdpi/banner.png"
          cp src/assets/icon.png "$RES/mipmap-xxxhdpi/ic_launcher.png"
          sed -i 's|<application |<application android:banner="@drawable/banner" |' "$MANIFEST"
          if ! grep -q 'android:supportsPictureInPicture' "$MANIFEST"; then
            sed -i 's#<activity #<activity android:supportsPictureInPicture="true" #' "$MANIFEST"
          fi
          cd build/flutter/android && ./gradlew assembleRelease
          mkdir -p ../../../build/apk
          mkdir -p ../../../build/apk
          find . -name "*.apk" -not -path "*/intermediates/*" -exec cp {} ../../../build/apk/ \;
          echo "Rebuilt APK with TV banner (320x180) and icon (512x512)"
      - name: Upload directly to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          files: build/apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 3. Android APK (split per ABI) ───────────────────────
  build-apk-split:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > kiri_keystore.jks
      - name: Build APK (split per ABI)
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/kiri_keystore.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: uv run flet build apk --yes --project ktv --product "KTV Player" --org ng.kiri --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} --split-per-abi --deep-linking-scheme "ktv" --deep-linking-host "play" -v
      - name: Inject TV banner, icon & rebuild with banner
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/kiri_keystore.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SERIOUS_PYTHON_SITE_PACKAGES: ${{ github.workspace }}/build/site-packages
        run: |
          MANIFEST=build/flutter/android/app/src/main/AndroidManifest.xml
          RES=build/flutter/android/app/src/main/res
          mkdir -p "$RES/drawable-xhdpi" "$RES/mipmap-xxxhdpi"
          cp src/assets/tv_banner.png "$RES/drawable-xhdpi/banner.png"
          cp src/assets/icon.png "$RES/mipmap-xxxhdpi/ic_launcher.png"
          sed -i 's|<application |<application android:banner="@drawable/banner" |' "$MANIFEST"
          if ! grep -q 'android:supportsPictureInPicture' "$MANIFEST"; then
            sed -i 's#<activity #<activity android:supportsPictureInPicture="true" #' "$MANIFEST"
          fi
          cd build/flutter/android && ./gradlew assembleRelease
          mkdir -p ../../../build/apk
          mkdir -p ../../../build/apk
          find . -name "*.apk" -not -path "*/intermediates/*" -exec cp {} ../../../build/apk/ \;
          echo "Rebuilt split APKs with TV banner (320x180) and icon (512x512)"
      - name: Upload directly to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          files: build/apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 4. Android AAB (Play Store) ──────────────────────────
  build-aab:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > kiri_keystore.jks
      - name: Build AAB
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/kiri_keystore.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: uv run flet build aab --yes --project ktv --product "KTV Player" --org ng.kiri --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} --deep-linking-scheme "ktv" --deep-linking-host "play" -v
      - name: Inject TV banner, icon & rebuild with banner
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/kiri_keystore.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SERIOUS_PYTHON_SITE_PACKAGES: ${{ github.workspace }}/build/site-packages
        run: |
          MANIFEST=build/flutter/android/app/src/main/AndroidManifest.xml
          RES=build/flutter/android/app/src/main/res
          mkdir -p "$RES/drawable-xhdpi" "$RES/mipmap-xxxhdpi"
          cp src/assets/tv_banner.png "$RES/drawable-xhdpi/banner.png"
          cp src/assets/icon.png "$RES/mipmap-xxxhdpi/ic_launcher.png"
          sed -i 's|<application |<application android:banner="@drawable/banner" |' "$MANIFEST"
          if ! grep -q 'android:supportsPictureInPicture' "$MANIFEST"; then
            sed -i 's#<activity #<activity android:supportsPictureInPicture="true" #' "$MANIFEST"
          fi
          cd build/flutter/android && ./gradlew bundleRelease
          mkdir -p ../../../build/aab
          find . -name "*.aab" -not -path "*/intermediates/*" -exec cp {} ../../../build/aab/ \;
          echo "Rebuilt AAB with TV banner (320x180) and icon (512x512)"
      - name: Upload directly to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          files: build/aab/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 5. Linux (.deb, .rpm & Universal .tar.gz) ────────────────
  build-linux:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Linux Build Dependencies & Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libmpv-dev mpv pkg-config rpm ruby ruby-dev
          sudo gem install --no-document fpm
      - name: Build Linux Bundle
        run: uv run flet build linux --yes --project ktv --product "KTV Player" --org ng.kiri --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} -v
      - name: Create Linux Packages (.deb, .rpm, .tar.gz)
        run: |
          mkdir -p build/dist

          # 1. Universal Portable .tar.gz
          tar -czf build/dist/KTV_Player_linux_x86_64.tar.gz -C build/linux .

          # 2. Stage filesystem tree for rich .deb and .rpm packages
          mkdir -p pkg_root/usr/lib/ktvplayer pkg_root/usr/bin pkg_root/usr/share/applications pkg_root/usr/share/icons/hicolor/256x256/apps pkg_root/usr/share/pixmaps pkg_root/usr/share/metainfo
          cp -a build/linux/* pkg_root/usr/lib/ktvplayer/
          chmod +x pkg_root/usr/lib/ktvplayer/ktv
          ln -s /usr/lib/ktvplayer/ktv pkg_root/usr/bin/ktvplayer

          # Icons
          cp src/assets/icon.png pkg_root/usr/share/icons/hicolor/256x256/apps/ktvplayer.png
          cp src/assets/icon.png pkg_root/usr/share/pixmaps/ktvplayer.png

          # Desktop entry
          cat <<EOF > pkg_root/usr/share/applications/ktvplayer.desktop
          [Desktop Entry]
          Version=1.0
          Name=KTV Player
          GenericName=IPTV & Local Media Player
          Comment=High-performance IPTV rendering engine and local video player
          Exec=/usr/bin/ktvplayer
          Icon=ktvplayer
          Terminal=false
          Type=Application
          Categories=AudioVideo;Player;TV;
          Keywords=IPTV;Player;Video;Stream;M3U;TV;
          StartupNotify=true
          StartupWMClass=ktv
          EOF

          # AppStream / AppData metainfo XML
          cat <<EOF > pkg_root/usr/share/metainfo/ng.kiri.ktvplayer.metainfo.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>ng.kiri.ktvplayer</id>
            <metadata_license>MIT</metadata_license>
            <project_license>MIT</project_license>
            <name>KTV Player</name>
            <summary>High-performance IPTV rendering engine and local video player</summary>
            <description>
              <p>KTV Player delivers a rich multi-platform media experience:</p>
              <ul>
                <li>Live IPTV streaming with real-time liveliness validation</li>
                <li>Local video library discovery with SAF and intent resolution</li>
                <li>Custom M3U/M3U8 playlist management and stealth shortcodes</li>
                <li>Budget Smart TV and desktop performance optimization</li>
              </ul>
            </description>
            <launchable type="desktop-id">ktvplayer.desktop</launchable>
            <url type="homepage">https://kiri.ng</url>
            <developer_name>Kiri</developer_name>
          </component>
          EOF

          # Build rich .deb using fpm
          fpm -s dir -t deb -n ktvplayer -v ${{ env.BUILD_VERSION }} --iteration ${{ env.BUILD_NUMBER }} \
              --architecture amd64 \
              --description "High-performance IPTV rendering engine and local video player." \
              --maintainer "Kiri <support@kiri.ng>" \
              --url "https://kiri.ng" \
              --category "video" \
              -p build/dist/KTV_Player_amd64.deb \
              -C pkg_root .

          # Build rich .rpm using fpm
          fpm -s dir -t rpm -n ktvplayer -v ${{ env.BUILD_VERSION }} --iteration ${{ env.BUILD_NUMBER }} \
              --architecture x86_64 \
              --description "High-performance IPTV rendering engine and local video player." \
              --maintainer "Kiri <support@kiri.ng>" \
              --url "https://kiri.ng" \
              --category "Video" \
              -p build/dist/KTV_Player_x86_64.rpm \
              -C pkg_root .

      - name: Upload directly to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          files: build/dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}