name: Build Multi-Platform & Create Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_version:
        description: "Build version"
        required: true
        default: "2.2.0"
      build_number:
        description: "Build number"
        required: true
        default: "19"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"
  UV_PYTHON: "3.14"
  BUILD_VERSION: ${{ inputs.build_version || '2.2.0' }}
  BUILD_NUMBER: ${{ inputs.build_number || '19' }}

jobs:
  # ─── Q. Quality gate: lint + tests (blocks every build) ───────────────
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies (incl. dev group)
        run: uv sync
      - name: Ruff
        run: uv run ruff check src tests
      - name: Ruff format
        run: uv run ruff format --check src tests
      - name: Tests
        run: uv run pytest -q

  # ─── A. Android manifest audit: TV device-catalog evidence ────────────
  # Builds the real app once and dumps the facts Play's device catalog
  # cares about (leanback required flag, LEANBACK_LAUNCHER, PiP flag,
  # min/target SDK, native ABIs, permissions) into the run log. No
  # artifacts uploaded.
  manifest-audit:
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK (first pass may fail on IMA desugaring)
        run: |
          set +e
          uv run flet build apk --yes --project ktv --product "KTV Player" --org ng.kiri -v
          set -e
          test -f build/flutter/android/app/build.gradle.kts
          GRADLE=build/flutter/android/app/build.gradle.kts
          grep -q "isCoreLibraryDesugaringEnabled" "$GRADLE" || \
            sed -i 's/compileOptions {/compileOptions {\n        isCoreLibraryDesugaringEnabled = true/' "$GRADLE"
          grep -q "coreLibraryDesugaring" "$GRADLE" || \
            sed -i 's/dependencies {}/dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}/' "$GRADLE"
          # A template change turns these seds into silent no-ops, which then
          # fails deep inside gradle with an unreadable AAR error.
          grep -q "isCoreLibraryDesugaringEnabled" "$GRADLE" || { echo "ERROR: desugaring flag patch did not apply"; exit 1; }
          grep -q "coreLibraryDesugaring" "$GRADLE" || { echo "ERROR: desugar_jdk_libs dependency missing"; exit 1; }
          test -d build/site-packages || { echo "ERROR: build/site-packages missing"; exit 1; }
          (cd build/flutter/android && SERIOUS_PYTHON_SITE_PACKAGES="$PWD/../../site-packages" ./gradlew assembleDebug --no-daemon)
      - name: Dump manifest + badging facts
        run: |
          APK=$(find build/flutter -name "app-debug.apk" -not -path "*/intermediates/*" | head -1)
          echo "=== APK: $APK ==="
          AAPT=$(find "${ANDROID_HOME:-$HOME/Android}" -name aapt -type f 2>/dev/null | sort -V | tail -1)
          if [ -n "$AAPT" ]; then
            echo "=== badging (sdk/features/native) ==="
            "$AAPT" dump badging "$APK" | grep -E "^package:|sdkVersion|targetSdkVersion|uses-feature|native-code|launchable-activity" || true
            echo "=== manifest: TV / PiP / network ==="
            "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -iE "leanback|picture_in_picture|INTERNET|ACCESS_NETWORK_STATE" | sort -u || true
          else
            echo "(no aapt binary on this runner — the merged manifest below is authoritative)"
          fi
          echo "=== merged manifest source (build output) ==="
          MERGED=$(find build/flutter/android -path "*intermediates*" -name "AndroidManifest.xml" | grep -iE "merged|processDebug" | head -1)
          echo "${MERGED:-<none found>}"
          [ -n "$MERGED" ] && grep -iE "leanback|LEANBACK_LAUNCHER|picture_in_picture|INTERNET|ACCESS_NETWORK_STATE" "$MERGED" | sort -u || true

  # ─── 0. Create Release Tag & Placeholder ───────────────
  prepare-release:
    needs: [quality]
    runs-on: ubuntu-latest
    outputs:
      TAG_NAME: ${{ steps.tag_info.outputs.TAG_NAME }}
      RELEASE_NAME: ${{ steps.tag_info.outputs.RELEASE_NAME }}
      IS_PRERELEASE: ${{ steps.tag_info.outputs.IS_PRERELEASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate Release Tag & Name
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=KTV Player ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "TAG_NAME=build-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=Automated Build (${SHORT_SHA})" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          fi
      - name: Create GitHub Release Placeholder
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.TAG_NAME }}
          name: ${{ steps.tag_info.outputs.RELEASE_NAME }}
          prerelease: ${{ steps.tag_info.outputs.IS_PRERELEASE }}
          make_latest: true
          body: |
            Automated multi-platform build generated from commit `${{ github.sha }}`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 1. Windows (.exe Installer) ─────────────────────────
  build-windows:
    needs: [prepare-release]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Build Windows Portable
        run: uv run flet build windows --yes --project ktv --product "KTV Player" --org ng.kiri --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} -v

      - name: Generate Icon for Installer
        run: |
          uv add pillow
          uv run python -c "from PIL import Image; Image.open('src/assets/icon.png').save('src/assets/icon.ico', format='ICO', sizes=[(256, 256)])"

      - name: Build Windows Installer (Inno Setup)
        run: |
          $IssContent = @"
          [Setup]
          AppId={{7B132174-8745-4B95-8F9B-983C66986F12}}
          AppName=KTV Player
          AppVersion=${{ env.BUILD_VERSION }}
          AppPublisher=Kiri
          AppPublisherURL=https://kiri.ng
          AppSupportURL=https://kiri.ng/support
          AppUpdatesURL=https://kiri.ng/updates
          AppCopyright=Copyright (C) 2026 Kiri
          DefaultDirName={autopf}\KTV Player
          DefaultGroupName=KTV Player
          OutputDir=.\build\installer
          OutputBaseFilename=KTV_Player_Setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          PrivilegesRequired=lowest
          SetupIconFile=.\src\assets\icon.ico
          UninstallDisplayIcon={app}\ktv.exe
          CloseApplications=yes
          AppMutex=KTVPlayer_Mutex

          [Files]
          Source: "build\windows\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\KTV Player"; Filename: "{app}\ktv.exe"
          Name: "{autodesktop}\KTV Player"; Filename: "{app}\ktv.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"; Flags: unchecked
          "@
          Set-Content -Path "installer.iss" -Value $IssContent -Encoding UTF8
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload directly to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          files: build/installer/KTV_Player_Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 2. Android APK (split per ABI) ───────────────────────
  build-apk-split:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > kiri_keystore.jks
      - name: Build APK (split per ABI)
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/kiri_keystore.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # First flet pass may fail on IMA's desugaring
          # requirement; the patch+rebuild step below is the real build.
          set +e
          uv run flet build apk --yes --project ktv --product "KTV Player" --org ng.kiri --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} --split-per-abi --deep-linking-scheme "ktv" --deep-linking-host "play" -v
          code=$?
          set -e
          test -f build/flutter/android/app/build.gradle.kts || exit $code
          echo "flet build exit $code — continuing; desugaring patch + gradle rebuild follow"
      - name: Inject TV banner, icon & rebuild with banner
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/kiri_keystore.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SERIOUS_PYTHON_SITE_PACKAGES: ${{ github.workspace }}/build/site-packages
        run: |
          MANIFEST=build/flutter/android/app/src/main/AndroidManifest.xml
          RES=build/flutter/android/app/src/main/res
          mkdir -p "$RES/drawable-xhdpi" "$RES/mipmap-xxxhdpi"
          cp src/assets/tv_banner.png "$RES/drawable-xhdpi/banner.png"
          cp src/assets/icon.png "$RES/mipmap-xxxhdpi/ic_launcher.png"
          # TV banner + Picture-in-Picture. Leanback, the microphone and
          # PiP *features* are declared in pyproject [tool.flet.android.feature];
          # only these two attributes still need injecting.
          sed -i 's|<application|<application android:banner="@drawable/banner"|' "$MANIFEST"
          sed -i 's|<activity|<activity android:supportsPictureInPicture="true"|g' "$MANIFEST"
          grep -n "supportsPictureInPicture" "$MANIFEST"
          # Remove the unpatched APKs from the first `flet build` step so stale
          # ones can never be staged if the rebuild doesn't regenerate them.
          rm -f build/flutter/build/app/outputs/flutter-apk/*.apk
          rm -f build/flutter/build/app/outputs/apk/release/*.apk
          # -Psplit-per-abi=true: the Flutter Gradle plugin only emits per-ABI
          # APKs when this property is set — plain `assembleRelease` builds the
          # universal APK only. Without it, the per-ABI APKs staged below are
          # the unpatched leftovers from the first `flet build` step.
          # flet-ima (Google IMA video ads) requires core-library
          # desugaring, which Flet's template doesn't enable. Guarded seds
          # are idempotent; the replacement re-adds the closing '}'.
          GRADLE=build/flutter/android/app/build.gradle.kts
          grep -q "isCoreLibraryDesugaringEnabled" "$GRADLE" || \
            sed -i 's/compileOptions {/compileOptions {\n        isCoreLibraryDesugaringEnabled = true/' "$GRADLE"
          grep -q "coreLibraryDesugaring" "$GRADLE" || \
            sed -i 's/dependencies {}/dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}/' "$GRADLE"
          # A template change turns these seds into silent no-ops, which then
          # fails deep inside gradle with an unreadable AAR error.
          grep -q "isCoreLibraryDesugaringEnabled" "$GRADLE" || { echo "ERROR: desugaring flag patch did not apply"; exit 1; }
          grep -q "coreLibraryDesugaring" "$GRADLE" || { echo "ERROR: desugar_jdk_libs dependency missing"; exit 1; }
          grep -n "resolvedMinSdk =" "$GRADLE" || true
          test -d "$SERIOUS_PYTHON_SITE_PACKAGES" || { echo "ERROR: $SERIOUS_PYTHON_SITE_PACKAGES missing"; exit 1; }
          (cd build/flutter/android && ./gradlew assembleRelease -Psplit-per-abi=true)
          rm -rf build/apk
          mkdir -p build/apk
          find build/flutter -name "*.apk" -not -path "*/intermediates/*" -exec cp {} build/apk/ \;
          # README links ktv-<abi>.apk — stage under the historical names so
          # the release always carries exactly one authoritative set.
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mv -f "build/apk/app-${abi}-release.apk" "build/apk/ktv-${abi}.apk" 2>/dev/null || true
          done